# rendered by the-steward 0.2.32 — do not hand-edit; re-render to change
name: steward

on:
  schedule:
    - cron: "57 2 * * *"
  workflow_dispatch:
    inputs:
      review:
        description: "Start your morning review (digest in the run summary; drive it from your phone if a claude.ai token is set)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: steward
  cancel-in-progress: false

jobs:
  watch:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.review) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has_signals: ${{ steps.watch.outputs.has_signals }}
      matrix: ${{ steps.watch.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: install the Steward
        run: for i in 1 2 3; do pipx install --quiet "the-steward==0.2.32" && break || { [ $i = 3 ] && exit 1; sleep 60; }; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: watch
        id: watch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: steward gha-watch

  execute:
    needs: watch
    if: needs.watch.outputs.has_signals == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.watch.outputs.matrix) }}
    steps:
      - name: check inference credential
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::No inference credential (CLAUDE_CODE_OAUTH_TOKEN empty/unset). Run 'claude setup-token' in the FOREGROUND (it opens a browser; it cannot be backgrounded), copy the printed token, then: gh secret set CLAUDE_CODE_OAUTH_TOKEN -R decletyarnaud-cyber/auction-platform"
            exit 1
          fi
          echo "inference credential present"
      - uses: actions/checkout@v4
      - name: install the Steward
        run: for i in 1 2 3; do pipx install --quiet "the-steward==0.2.32" && break || { [ $i = 3 ] && exit 1; sleep 60; }; done
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --extra test
      - name: cache the claude CLI download
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-claude-code-v1
      - name: install claude CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: execute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          STEWARD_SIG: ${{ matrix.sig }}
          STEWARD_SIGNATURE: ${{ matrix.signature }}
          STEWARD_SAMPLE: ${{ matrix.sample }}
          STEWARD_TEST_CMD: ""
          STEWARD_AUTO_FIX: "1"
          ST_CLAUDE_ARGS: "--dangerously-skip-permissions"
        run: steward gha-execute

  review:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.review }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: install the Steward
        run: for i in 1 2 3; do pipx install --quiet "the-steward==0.2.32" && break || { [ $i = 3 ] && exit 1; sleep 60; }; done
      - name: cache the claude CLI download
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-claude-code-v1
      - name: install claude CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STEWARD_RC_MODEL: "sonnet"
          STEWARD_RC_TIMEOUT: "3600"
          ST_CLAUDE_ARGS: "--dangerously-skip-permissions"
        run: steward gha-review
